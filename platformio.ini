;PlatformIO Project Configuration File for Simple ESP32 OTA
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages

[platformio]
default_envs = esp32-basic-ota

; Basic ESP32 OTA Example (USB first)
[env:esp32-basic-ota]
platform = espressif32
board = esp32dev
framework = arduino

; Use basic OTA source file
build_src_filter = +<basic_ota.cpp> -<main.cpp>

; USB upload first
upload_port = COM8
monitor_port = COM8
upload_speed = 115200
monitor_speed = 115200

; Basic libraries only
lib_deps = 

; OTA Wireless Upload Environment - Use after first USB upload
[env:esp32-ota-wireless]
platform = espressif32
board = esp32dev
framework = arduino

; Use basic OTA source file
build_src_filter = +<basic_ota.cpp> -<main.cpp>

; OTA Upload Configuration
upload_protocol = espota
upload_port = 10.248.106.252  ; Actual IP from serial monitor
upload_flags = 
    --auth=admin123

monitor_speed = 115200
