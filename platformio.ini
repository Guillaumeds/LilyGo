;PlatformIO Project Configuration File for LilyGO T-SIM7000G
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages

[platformio]
; Choose which program to run:
; default_envs = T-SIM7000G              ; Main GPS & Battery program
; default_envs = T-SIM7000G-APN-Detect   ; APN auto-detection
; default_envs = T-SIM7000G-Hardware-Test ; Hardware test

default_envs = T-SIM7000G

[env:T-SIM7000G]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino

; Build flags
build_flags =
    -DLILYGO_SIM7000G
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Library dependencies
lib_deps =
    https://github.com/lewisxhe/TinyGSM.git
    bblanchon/ArduinoJson@^6.21.3

; Upload and Monitor settings
; upload_port = COM8  ; Let PlatformIO auto-detect
; monitor_port = COM8
upload_speed = 115200
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder

; WiFi OTA Environment - Use this after first USB upload
[env:T-SIM7000G-OTA]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino

; Build flags
build_flags =
    -DLILYGO_SIM7000G
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Library dependencies
lib_deps =
    https://github.com/lewisxhe/TinyGSM.git
    bblanchon/ArduinoJson@^6.21.3

; OTA Upload Configuration
upload_protocol = espota
upload_port = lilygo-sim7000g.local  ; mDNS name
; upload_port = 192.168.43.100        ; Or use IP address from Step 1
upload_flags =
    --auth=lilygo123                  ; OTA password

; Monitor settings
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder

; APN Detection Environment
[env:T-SIM7000G-APN-Detect]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
src_filter = +<../test/apn_detector.cpp>

build_flags =
    -DLILYGO_SIM7000G
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    https://github.com/lewisxhe/TinyGSM.git

monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder

; Hardware Test Environment
[env:T-SIM7000G-Hardware-Test]
platform = espressif32@6.11.0
board = esp32dev
framework = arduino
src_filter = +<../test/hardware_test.cpp>

build_flags =
    -DLILYGO_SIM7000G
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
